name: CPU tests
on: [push, pull_request]
jobs:
  regression-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install torch==2.0.1 torchvision==0.15.2 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q dentalpsam
      - run: pytest -q
      - run: bash tests/run_checks.sh
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir /tmp/dentalpsam-wheel
      - run: python tests/check_distribution.py --wheel-dir /tmp/dentalpsam-wheel
      - run: python tests/check_git_payload.py
