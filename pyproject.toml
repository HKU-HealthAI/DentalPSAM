[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dentalpsam"
version = "0.1.0.dev0"
description = "Dental-plaque segmentation with aligned 2D and 3D inputs"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
  "numpy>=1.21,<2",
  "torch>=2.0,<2.1",
  "torchvision>=0.15,<0.16",
  "opencv-python>=4.5,<5",
  "open3d>=0.17,<0.19",
  "pandas>=1.3,<3",
  "plyfile>=0.7,<2",
  "monai>=1.2,<1.4",
  "patchify>=0.2.3,<0.3",
  "scikit-learn>=1.0,<1.7",
  "tqdm>=4.64,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/HKU-HealthAI/DentalPSAM"

[tool.setuptools.packages.find]
include = ["dentalpsam*"]
exclude = ["tests*", "dev*", "reproducibility*"]

[tool.setuptools.package-data]
dentalpsam = ["README.md", "segment_anything/README.md", "segment_anything/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
target-version = ["py39"]
extend-exclude = "dentalpsam/segment_anything/"
